name: PR Build & Distribute

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  build-and-distribute:
    name: Build & Distribute Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-pr${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload to Firebase App Distribution
        id: firebase-upload
        run: |
          npm install -g firebase-tools
          OUTPUT=$(firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "solo-dev" \
            --release-notes "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }} (commit: ${{ github.sha }})" 2>&1)
          echo "$OUTPUT"
          SHARE_URL=$(echo "$OUTPUT" | grep -oP 'https://appdistribution\.firebase\.google\.com/testerapps/[^\s?]+')
          CONSOLE_URL=$(echo "$OUTPUT" | grep -oP 'https://console\.firebase\.google\.com/[^\s?]+')
          echo "share_url=$SHARE_URL" >> "$GITHUB_OUTPUT"
          echo "console_url=$CONSOLE_URL" >> "$GITHUB_OUTPUT"

      - name: Post QR code comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const shareUrl = '${{ steps.firebase-upload.outputs.share_url }}';
            const consoleUrl = '${{ steps.firebase-upload.outputs.console_url }}';
            const testerLink = shareUrl || consoleUrl || 'https://appdistribution.firebase.google.com';
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(testerLink)}`;
            const sha = context.sha.substring(0, 7);
            const branch = context.payload.pull_request.head.ref;

            const body = [
              `## Firebase App Distribution`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Scan to install** | **Build info** |`,
              `| ![QR Code](${qrCodeUrl}) | **Commit:** \`${sha}\`<br>**Branch:** \`${branch}\`<br>[Direct link](${testerLink}) |`,
              ``,
              `<details>`,
              `<summary>First time? Setup instructions</summary>`,
              ``,
              `1. On your Android device, go to [appdistribution.firebase.google.com](https://appdistribution.firebase.google.com)`,
              `2. Sign in with the Google account added to the \`solo-dev\` tester group`,
              `3. Download the **Firebase App Tester** app when prompted`,
              `4. Scan the QR code or tap the direct link to install the build`,
              `</details>`,
            ].join('\n');

            // Find existing bot comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Firebase App Distribution';
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
